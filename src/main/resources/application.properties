spring.data.mongodb.database=activity-tracker
spring.data.mongodb.port=27017
spring.data.mongodb.host=localhost
spring.datasource.url=jdbc:postgresql://localhost:5432/activity-tracker
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
server.port=8008
server.servlet.context-path=/api
server.error.whitelabel.enabled=false
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

#jwt properties
jwt.signing.key.secret = ${JWT_KEY_SECRET}
jwt.token.expiration.in.ms=3600000
jwt.token.refreshExpiration.in.ms = 86400000
users.datasource.url=jdbc:postgresql://localhost:5432/users
users.datasource.username=${POSTGRES_USERNAME}
users.datasource.password=${POSTGRES_PASSWORD}
users.jpa.hibernate.ddl-auto=update